; fm07mod configuration. Keep next to dsound.dll (or fm07mod.dll + fm07launch.exe).
; The mod writes the current window size/position, maximised state, mode and zoom back to
; this file while you play, so the next launch looks the same.

[launcher]
; only used by fm07launch.exe when it is NOT inside the game folder
game_dir=

[display]
; window mode on startup: game (use the game's saved choice), windowed, fullscreen
; (the in-game windowed/fullscreen option keeps working after startup)
mode=windowed
; window client size in real pixels; 0 = game default
window_width=1600
window_height=900
; 1 = window can be resized/maximized to any size (game normally caps at 1600x1200)
resizable=1
start_maximized=0
; 0 = fullscreen is a borderless window at desktop resolution (no display mode change)
; 1 = original exclusive fullscreen that changes the display resolution
exclusive_fullscreen=0

; UI scale. 1.0 = original size, 1.5 = 150%, auto = Windows display scaling.
; Automatically limited so the UI never gets smaller than the game's minimum (1024x768).
; Hotkeys in game: Ctrl+Alt+= zoom in, Ctrl+Alt+- zoom out, Ctrl+Alt+0 reset to 100%
zoom=auto
zoom_step=0.25
; 1 = draw text, boxes and images natively at full resolution (sharp)
; 0 = scale the whole frame as a bitmap
hires_text=1
; 1 = smooth scaling for whatever is still upscaled, 0 = sharp/nearest
smooth=1
; 1 = tell Windows we handle scaling ourselves (prevents blurry double scaling)
dpi_aware=1
; smallest logical UI size; 0 = the game's own minimum (1024x768 in FM07 7.0.2)
min_logical_width=0
min_logical_height=0
; largest logical UI size; -1 = no limit (default), 0 = the game's own maximum (1600x1200),
; which raises the zoom automatically on big windows
max_logical_width=-1
max_logical_height=-1

[performance]
; 1 = direct file reads/writes (removes two seeks + RTTI casts per engine file access)
fast_file_io=1
